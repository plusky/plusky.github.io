<svg viewBox="0 0 360 733" role="img" aria-labelledby="labels-n-t labels-n-d" xmlns="http://www.w3.org/2000/svg">
<title id="labels-n-t">Where the class labels come from: people, the gold set and the silver set</title>
<desc id="labels-n-d">People labelled 90 of 1,316 failed jobs with a bug reference, and none of the 83 with a public ticket is infrastructure; the 98 gold jobs come from 27 tickets, one of them 18 jobs; all 111 infrastructure labels come from the 299-job silver set labelled by a frontier model with hindsight.</desc>
