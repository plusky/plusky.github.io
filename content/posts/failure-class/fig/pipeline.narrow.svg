<svg viewBox="0 0 360 694" role="img" aria-labelledby="pipeline-n-t pipeline-n-d" xmlns="http://www.w3.org/2000/svg">
<title id="pipeline-n-t">From a failed job to a comment</title>
<desc id="pipeline-n-d">The model gives three answers per job, and only one of them is wired to anything.</desc>
<g>
<rect class="box" x="0" y="0" width="360" height="94" rx="6"/>
<text class="t-strong" x="12" y="24">Test job fails</text>
<text class="t" x="12" y="42">the job-done hook finds</text>
<text class="t" x="12" y="60">no known issue and runs</text>
<text class="t-mono" x="12" y="78">openqa-llm-investigate</text>
<path class="arrow" d="M180 94L180 114"/>
<path class="head" d="M180 120L176.5 113L183.5 113Z"/>
<rect class="box" x="0" y="120" width="360" height="112" rx="6"/>
<text class="t-strong" x="12" y="144">One prompt</text>
<text class="t" x="12" y="162">failure analysis of the log</text>
<text class="t" x="12" y="180">earlier reviews of the module</text>
<text class="t" x="12" y="198">settings diff to last good job</text>
<text class="t" x="12" y="216">test commits since then</text>
<path class="arrow" d="M180 232L180 252"/>
<path class="head" d="M180 258L176.5 251L183.5 251Z"/>
<rect class="box" x="0" y="258" width="360" height="112" rx="6"/>
<text class="t-strong" x="12" y="282">llama.cpp server</text>
<text class="t-muted" x="12" y="300">Gemma 4 E4B, 3 hosts, nginx</text>
<text class="t-strong" x="12" y="324">Q1</text>
<text class="t" x="40" y="324">analysis per module</text>
<text class="t-strong" x="12" y="342">Q2</text>
<text class="t" x="40" y="342">summary, at most 2 sentences</text>
<text class="t-strong" x="12" y="360">Q3</text>
<text class="t" x="40" y="360">verdict, with job statistics</text>
<path class="arrow" d="M80 370L80 398"/>
<path class="head" d="M80 404L76.5 397L83.5 397Z"/>
<text class="t-muted" x="92" y="392">the script posts the replies</text>
</g>
<g>
<rect class="box" x="0" y="404" width="164" height="286" rx="6"/>
<text class="t-strong" x="12" y="428">Job comment</text>
<text class="t-muted" x="12" y="446">ends with three lines:</text>
<text class="t-mono" x="12" y="482">Classification:</text>
<text class="t-muted" x="12" y="500">Product bug | Test issue |</text>
<text class="t-muted" x="12" y="516">Infrastructure problem</text>
<rect class="box" x="198" y="462" width="162" height="68" rx="6"/>
<text class="t-strong" x="210" y="485">People only</text>
<text class="t" x="210" y="503">reviewed 2.2% of</text>
<text class="t" x="210" y="521">commented jobs</text>
<path class="arrow" d="M164 496L192 496"/>
<path class="head" d="M198 496L191 499.5L191 492.5Z"/>
<text class="t-mono" x="12" y="568">BISECT: YES | NO</text>
<rect class="box-focus" x="198" y="542" width="162" height="86" rx="6"/>
<text class="t-strong" x="210" y="565">openqa-investigate</text>
<text class="t" x="210" y="583">retry, last good tests</text>
<text class="t" x="210" y="601">and build, then</text>
<text class="t" x="210" y="619">bisect jobs</text>
<path class="s-focus" d="M164 564L191 564"/>
<path class="c-focus" d="M198 564L190 568L190 560Z"/>
<text class="t-strong" x="181" y="556" text-anchor="middle">YES</text>
<text class="t-mono" x="12" y="656">Restart: YES | NO</text>
<path class="arrow-off" d="M164 652L188 652"/>
<path class="head-off" d="M194 652L187 655.5L187 648.5Z"/>
<text class="t-strong" x="202" y="656">not connected:</text>
<text class="t" x="202" y="674">nothing acts on it</text>
</g>
</svg>
