<svg viewBox="0 0 360 536" role="img" aria-labelledby="thinking-n-t thinking-n-d" xmlns="http://www.w3.org/2000/svg">
<title id="thinking-n-t">Thinking on against off: tokens generated, seconds per job and jobs with the right class</title>
<desc id="thinking-n-d">On an aarch64 test VM, thinking was 91% of the tokens the model generated; turning it off cut the median job from 629 to 401 seconds and the time for all 17 jobs by 37%, but dropped the jobs with the right class from 13 to 9.</desc>
